<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC - Level 4: The Master Credential</title>
    <style>
        * {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #ec4899;
            margin: 0;
            font-size: 2rem;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 1.5rem;
            color: #ff91c8;
            font-weight: 1000;
            margin-top: 200px;
        }

        .level-badge {
            padding: 4px 12px;
            color: #ec4899;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 40px;
        }

        .secret-text {
            font-size: 0.5px;
            color: #004600;
            position: absolute;
            pointer-events: none;
            user-select: all;
        }

        .back-btn {
            position: fixed;
            bottom: 50px;
            padding: 10px 25px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <span class="level-badge">Final Level</span>
    <h1>The Mystery</h1>
    <h3 id="statusText" class="status-msg"></h3>

    <p id="secretPassword" class="secret-text">gla_cyber_master</p>

    <a href="2.html" class="back-btn">↩ Back to Page 2</a>

    <script>
        const secret = document.getElementById("secretPassword");
        const randomX = Math.floor(Math.random() * 80) + 10;
        const randomY = Math.floor(Math.random() * 80) + 10;
        
        secret.style.left = randomX + "vw";
        secret.style.top = randomY + "vh";

        const statusEl = document.getElementById("statusText");

        setTimeout(function() {
            statusEl.innerText = "HARD?";
        }, 8000);

        setTimeout(function() {
            statusEl.innerText = "IMPOSSIBLE?";
        }, 20000);
    </script>
</body>
</html>
