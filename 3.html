<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC - Level 3: The Trap Password</title>
    <style>
        * {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        h1 {
            color: #f59e0b;
            font-size: 2rem;
            margin: 0;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        .btn-wrapper {
            position: relative;
            margin-top: 30px;
            display: inline-block;
        }

        .hidden-password {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            color: #0b0700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            white-space: nowrap;
            user-select: none;
            z-index: 1;
        }

        .next-btn {
            position: relative;
            z-index: 2;
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        .level-badge {
            display: inline-block;
            padding: 4px 12px;
            color: #f59e0b;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <span class="level-badge">Level 3 of 4</span>
    <h1>Found the password?</h1>

    <p style="font-size: 0.9rem; color: #cbd5e1;">Copy the password to save it</p>

    <div class="btn-wrapper">
        <!-- Page 3 Next button ALWAYS directs to Page 2 -->
        <a id="nextBtn" href="2.html" class="next-btn">Next ➔</a>
        <span class="hidden-password">foolish_gla_student</span>
    </div>

</body>
</html>
